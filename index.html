<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الحضارة الفكرية - 1 الإصدار المعماري</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;600;700&display=swap">
    
    <link rel="stylesheet" href="./css/main.css?v=1.1">
    <link rel="stylesheet" href="./css/theme.css?v=1.1">
    <link rel="stylesheet" href="./css/animations.css?v=1.1">
    <link rel="stylesheet" href="./css/cards.css?v=1.1">
    <link rel="stylesheet" href="./css/article.css?v=1.1">
</head>
<body>

    <nav class="glass border-b border-white/5 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-reverse space-x-3 cursor-pointer" id="nav-logo">
                <div class="w-9 h-9 rounded-lg bg-amber-500/20 flex items-center justify-center text-amber-500">
                    <i class="fas fa-landmark"></i>
                </div>
                <span class="font-['Reem_Kufi'] text-xl font-bold tracking-wide text-amber-500">الحضارة</span>
            </div>
            <div class="flex items-center gap-3">
                <button id="themeBtn" class="w-10 h-10 rounded-full glass border border-white/5 flex items-center justify-center text-gray-400 hover:text-amber-500 transition-colors">
                    <i class="fas fa-sun"></i>
                </button>
                <a href="dashboard.html" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold text-sm transition-colors flex items-center gap-2">
                    <i class="fas fa-feather"></i> محراب التحكم
                </a>
            </div>
        </div>
    </nav>

    <section id="view-home" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="text-center max-w-3xl mx-auto mb-16">
            <h1 class="font-['Reem_Kufi'] text-4xl md:text-6xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-amber-200 to-white leading-tight">بناء الوعي وتفكيك المقولات</h1>
            <p class="text-gray-400 md:text-lg font-light leading-relaxed">منصة معاصرة تُعنى بالدراسات الفلسفية والأطروحات السياسية، ومقاربة القضايا بنظرة حضارية عميقة.</p>
        </div>
        <div id="categories-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
    </section>

    <section id="view-category" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 hidden">
        <button class="back-btn mb-8 px-4 py-2 rounded-xl glass border border-white/5 text-sm text-gray-400 hover:text-amber-500 transition-colors flex items-center gap-2">
            <i class="fas fa-arrow-right"></i> العودة للمحراب الرئيسي
        </button>
        <div class="mb-12 border-b border-white/5 pb-6">
            <h2 id="cat-title" class="font-['Reem_Kufi'] text-3xl font-bold text-amber-500 mb-2">اسم العلم</h2>
            <p id="cat-desc" class="text-gray-400 font-light max-w-3xl leading-relaxed">وصف دقيق لهذا العلم وسياقه المعرفي البنيوي.</p>
        </div>
        <div id="articles-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </section>

    <section id="view-article" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 hidden">
        <button class="back-btn mb-8 px-4 py-2 rounded-xl glass border border-white/5 text-sm text-gray-400 hover:text-amber-500 transition-colors flex items-center gap-2">
            <i class="fas fa-arrow-right"></i> العودة للأطروحات
        </button>
        <article class="glass rounded-3xl p-6 md:p-12 border border-white/5">
            <header id="article-header" class="mb-8 pb-6 border-b border-white/5">
                </header>
            <div id="article-body" class="article-body text-gray-300">
                </div>
        </article>
    </section>

    <script type="module" src="./js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الحضارة الفكرية - لوحة التحكم</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/article.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        panelBg: '#111827',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0b0f19] text-white font-sans antialiased min-h-screen transition-colors duration-300"></body>

    <div class="flex min-h-screen w-full relative">
        
        <aside class="w-64 bg-[#111827] border-l border-white/5 p-6 flex flex-col justify-between hidden md:flex shrink-0">
            <div>
                <div class="flex items-center space-x-reverse space-x-3 mb-8">
                    <i class="fas fa-landmark text-amber-500 text-2xl"></i>
                    <span class="text-xl font-bold tracking-wide">محراب التحكم</span>
                </div>
                
                <nav class="space-y-2">
                    <a href="./index.html" class="flex items-center space-x-reverse space-x-3 p-3 rounded-xl bg-amber-500/10 text-amber-500 font-medium">
                        <i class="fas fa-home w-5 text-center"></i>
                        <span>المحراب الرئيسي</span>
                    </a>
                    <div id="sidebar-menu" class="space-y-2"></div>
                </nav>
            </div>
            
            <div class="border-t border-white/5 pt-4 space-y-3">
                <button id="theme-toggle" class="w-full flex items-center justify-center space-x-reverse space-x-2 p-3 rounded-xl bg-white/5 hover:bg-amber-500 hover:text-darkBg transition-all">
                    <i id="theme-icon" class="fas fa-moon"></i>
                    <span id="theme-text">الوضع الليلي</span>
                </button>
                <div class="text-xs text-gray-500 text-center">منصة الحضارة الفكرية &copy; 2026</div>
            </div>
        </aside>

        <main class="flex-1 w-full bg-[#0b0f19] p-6 md:p-8 overflow-y-auto">
            
            <header class="mb-8 border-b border-white/5 pb-6">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">
                    بناء الوعي وتفكيك المقولات
                </h1>
                <p class="text-gray-400 mt-2 text-sm md:text-base max-w-3xl">
                    منصة معاصرة تُعنى بالدراسات الفلسفية والأطروحات السياسية، ومقاربة القضايا بنظرة حضارية عميقة.
                </p>
            </header>
            
            <div class="space-y-10 w-full">
                
                <section>
                    <h2 class="text-xl font-bold mb-6 text-amber-400 flex items-center space-x-reverse space-x-2">
                        <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                        <span>العلوم الأساسية للدراسات</span>
                    </h2>
                    <div id="primary-sciences-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                        </div>
                </section>

                <section>
                    <h2 class="text-xl font-bold mb-6 text-orange-400 flex items-center space-x-reverse space-x-2">
                        <span class="w-2 h-2 rounded-full bg-orange-400"></span>
                        <span>العلوم الثانوية والمشاريع</span>
                    </h2>
                    <div id="secondary-sciences-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                        </div>
                </section>

            </div>
        </main>
    </div>

    <script src="./js/router.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // جلب العناصر بدقة بناءً على معرفاتها المحددة في الـ aside
            const toggleBtn = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            // دالة التحكم في تحديث واجهة المستخدم (النص والأيقونة)
            function updateThemeUI(isDark) {
                if (isDark) {
                    if (themeIcon) themeIcon.className = 'fas fa-moon text-blue-400';
                    if (themeText) themeText.innerText = 'الوضع الليلي';
                } else {
                    if (themeIcon) themeIcon.className = 'fas fa-sun text-amber-500';
                    if (themeText) themeText.innerText = 'الوضع النهاري';
                }
            }

            // فحص الحالة الافتراضية عند تحميل الصفحة (إذا لم يحتوي الـ body على light فهو داكن افتراضياً)
            const isInitiallyDark = !document.body.classList.contains('light');
            updateThemeUI(isInitiallyDark);

            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    // 1. التبديل لـ Tailwind CSS على مستوى عنصر الـ html العلوي
                    document.documentElement.classList.toggle('dark');
                    
                    // 2. التبديل لملف theme.css المخصص على مستوى الـ body
                    document.body.classList.toggle('light');

                    // 3. تحديث حالة النصوص والأيقونات فوراً بعد الضغط
                    const currentIsDark = !document.body.classList.contains('light');
                    updateThemeUI(currentIsDark);
                });
            }
        });
    </script>
</body>
</html>
